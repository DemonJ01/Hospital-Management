<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor Registration | Hospital Management</title><style>body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f3f7fa;color:#1c2932;line-height:1.55}main{max-width:850px;margin:5vh auto;padding:2rem;background:white;border:1px solid #dce5ec;border-radius:12px}a{color:#125c84}nav a{margin-right:1rem}label{display:block;margin:1rem 0}input,textarea,select{display:block;width:100%;max-width:440px;padding:.6rem;border:1px solid #9cb0bd;border-radius:5px}button{background:#156b80;color:white;padding:.65rem 1.3rem;border:0;border-radius:6px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #f6a500}ul{padding-left:1.4rem}</style></head><body><main>
<p><a href="/">Hospital Management</a></p><h1>Doctor Registration</h1><p>Request a doctor account.</p>
<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ userForm.as_p }}{{ doctorForm.as_p }}{{ patientForm.as_p }}{% if userForm.errors or doctorForm.errors or patientForm.errors %}<p role="alert">Please correct the form errors.</p>{% endif %}<button type="submit">Submit registration</button></form>
</main></body></html>
