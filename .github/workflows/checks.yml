name: Django syntax checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q hospital hospitalmanagement projectname manage.py
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
        env:
          DJANGO_DEBUG: 'true'
      - run: python manage.py test hospital --noinput
        env:
          DJANGO_DEBUG: 'true'
